openapi: 3.0.3

info:
  title: Product API
  description: |
    OpenAPI-спецификация для сущности Product

    #### Каталог error codes:

    | Код ошибки | HTTP-статус | Когда возвращается |
    |------------|-------------|---------------------|
    | PRODUCT_NOT_FOUND | 404 | Товар не найден по ID |
    | PRODUCT_INACTIVE | 409 | Попытка заказать неактивный товар |
    | ORDER_NOT_FOUND | 404 | Заказ не найден по ID |
    | ORDER_LIMIT_EXCEEDED | 429 | Превышен лимит частоты создания/обновления заказа |
    | ORDER_HAS_ACTIVE | 409 | У пользователя уже есть активный заказ |
    | INVALID_STATE_TRANSITION | 409 | Недопустимый переход состояния заказа |
    | INSUFFICIENT_STOCK | 409 | Недостаточно товара на складе |
    | PROMO_CODE_INVALID | 422 | Промокод не найден, истёк, исчерпан или неактивен |
    | PROMO_CODE_MIN_AMOUNT | 422 | Сумма заказа ниже минимальной для промокода |
    | ORDER_OWNERSHIP_VIOLATION | 403 | Заказ принадлежит другому пользователю |
    | VALIDATION_ERROR | 400 | Ошибка валидации входных данных |
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Локальный сервер разработки

tags:
  - name: products
    description: Операции с продуктами

paths:
  /products:
    get:
      summary: Получить список товаров
      description: Возвращает список товаров с пагинацией и фильтрацией
      operationId: listProducts
      tags:
        - products
      parameters:
        - name: page
          in: query
          description: Номер страницы (начиная с 0)
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Размер страницы
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 20
        - name: status
          in: query
          description: Фильтр по статусу товара
          required: false
          schema:
            $ref: '#/components/schemas/ProductStatus'
        - name: category
          in: query
          description: Фильтр по категории
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Список товаров с пагинацией и фильтрацией
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
              example:
                content:
                  - id: 1
                    name: "Дорожный утюг"
                    description: "Компактный утюг. Подойдет для поездок."
                    price: 1499.99
                    stock: 50
                    category: "Бытовая техника"
                    status: ACTIVE
                    created_at: "2026-03-04T10:00:00Z"
                    updated_at: "2026-03-04T10:00:00Z"
                totalElements: 1
                page: 0
                size: 20
        '400':
          description: Ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error_code: "VALIDATION_ERROR"
                message: "Field 'page' is required"

    post:
      summary: Создание товара
      operationId: createProduct
      tags:
        - products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
            example:
              name: "Дорожный утюг"
              description: "Компактный утюг. Подойдет для поездок."
              price: 1499.99
              stock: 50
              category: "Бытовая техника"
              status: ACTIVE
      responses:
        '201':
          description: Товар успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error_code: "VALIDATION_ERROR"
                message: "Field 'name' is required"

  /products/{id}:
    get:
      summary: Получение товара по ID
      operationId: getProductById
      tags:
        - products
      parameters:
        - name: id
          in: path
          description: Идентификатор товара
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Товар найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error_code: "VALIDATION_ERROR"
                message: "Field 'id' is required"
        '404':
          description: Товар не найден по ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error_code: "PRODUCT_NOT_FOUND"
                message: "Product with id 999 not found"

    put:
      summary: Обновление товара
      operationId: updateProduct
      tags:
        - products
      parameters:
        - name: id
          in: path
          description: Идентификатор товара
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
            example:
              name: "Дорожный утюг"
              price: 2000.0
              stock: 120
              category: "Бытовая техника"
              status: ACTIVE
      responses:
        '200':
          description: Товар обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error_code: "VALIDATION_ERROR"
                message: "Field 'id' is required"
        '404':
          description: Товар не найден по ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error_code: "PRODUCT_NOT_FOUND"
                message: "Product with id 999 not found"

    delete:
      summary: Мягкое удаление товара
      description: Перевод товара в статус ARCHIVED
      operationId: deleteProduct
      tags:
        - products
      parameters:
        - name: id
          in: path
          description: Идентификатор товара
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Продукт удален (тело ответа пустое)
        '400':
          description: Ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error_code: "VALIDATION_ERROR"
                message: "Field 'id' is required"
        '404':
          description: Товар не найден по ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error_code: "PRODUCT_NOT_FOUND"
                message: "Product with id 999 not found"

components:
  schemas:
    ProductStatus:
      type: string
      description: Статус товара.
      enum: [ACTIVE, INACTIVE, ARCHIVED]

    ProductListResponse:
      type: object
      description: Ответ со списком товаров.
      required:
        - content
        - totalElements
        - page
        - size
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        totalElements:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32

    ProductResponse:
      type: object
      description: Ответ с полной информацией о товаре.
      properties:
        id:
          type: integer
          format: int64
          description: Идентификатор товара
          example: 1
        name:
          type: string
          description: Название товара
          minLength: 1
          maxLength: 255
          example: "Дорожный утюг"
        description:
          type: string
          description: Описание товара
          nullable: true
          maxLength: 4000
          example: "Компактный утюг. Подойдет для поездок."
        price:
          type: number
          format: float
          description: Цена товара (> 0)
          minimum: 0.01
          example: 1499.99
        stock:
          type: integer
          format: int32
          description: Остаток на складе (>= 0)
          minimum: 0
          example: 50
        category:
          type: string
          description: Категория товара
          minLength: 1
          maxLength: 100
          example: "Бытовая техника"
        status:
          $ref: '#/components/schemas/ProductStatus'
          description: Состояние товара
          example: ACTIVE
        created_at:
          type: string
          format: date-time
          description: Время создания
          example: "2026-03-04T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Время обновления
          example: "2026-03-04T11:30:00Z"
      required:
        - id
        - name
        - price
        - stock
        - category
        - status
        - created_at
        - updated_at

    ProductCreate:
      type: object
      description: Данные для создания нового товара.
      properties:
        name:
          type: string
          description: Название товара
          minLength: 1
          maxLength: 255
          example: "Дорожный утюг"
        description:
          type: string
          description: Описание товара
          nullable: true
          maxLength: 4000
          example: "Компактный утюг. Подойдет для поездок."
        price:
          type: number
          format: float
          description: Цена товара (> 0)
          minimum: 0.01
          example: 1499.99
        stock:
          type: integer
          format: int32
          description: Остаток на складе (>= 0)
          minimum: 0
          example: 50
        category:
          type: string
          description: Категория товара
          minLength: 1
          maxLength: 100
          example: "Бытовая техника"
        status:
          $ref: '#/components/schemas/ProductStatus'
          description: Состояние товара
          example: ACTIVE
      required:
        - name
        - price
        - stock
        - category
        - status

    ProductUpdate:
      type: object
      description: Данные для обновления существующего товара.
      properties:
        name:
          type: string
          description: Название товара
          minLength: 1
          maxLength: 255
          example: "Дорожный утюг"
        description:
          type: string
          description: Описание товара
          nullable: true
          maxLength: 4000
          example: "Компактный утюг. Подойдет для поездок."
        price:
          type: number
          format: float
          description: Цена товара (> 0)
          minimum: 0.01
          example: 1499.99
        stock:
          type: integer
          format: int32
          description: Остаток на складе (>= 0)
          minimum: 0
          example: 50
        category:
          type: string
          description: Категория товара
          minLength: 1
          maxLength: 100
          example: "Бытовая техника"
        status:
          $ref: '#/components/schemas/ProductStatus'
          description: Состояние товара
          example: INACTIVE
      required:
        - name
        - price
        - stock
        - category
        - status

    Error:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Человекочитаемое описание
          example: "Field 'name' is required"
        details:
          type: object
          description: Детали ошибки

    ErrorCode:
      type: string
      description: Машинночитаемый код ошибки
      enum: [PRODUCT_NOT_FOUND, PRODUCT_INACTIVE, ORDER_NOT_FOUND, ORDER_LIMIT_EXCEEDED, ORDER_HAS_ACTIVE, INVALID_STATE_TRANSITION, INSUFFICIENT_STOCK, PROMO_CODE_INVALID, PROMO_CODE_MIN_AMOUNT, ORDER_OWNERSHIP_VIOLATION, VALIDATION_ERROR, ]  